name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q
      - name: Command-line smoke test
        run: uv run --python ${{ matrix.python }} rameau harmonize src/rameau/samples/old_hundredth.abc --out out --svg
